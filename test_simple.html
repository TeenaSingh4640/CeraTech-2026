<!DOCTYPE html>
<html>
<head>
    <title>Simple Test</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
        }
        button {
            background: #00C9A7;
            color: white;
            padding: 20px 40px;
            border: none;
            border-radius: 8px;
            font-size: 18px;
            cursor: pointer;
            font-weight: bold;
        }
        button:hover {
            background: #00A88C;
        }
        #result {
            margin-top: 30px;
            padding: 20px;
            background: #f0f0f0;
            border-radius: 8px;
            display: none;
        }
    </style>
</head>
<body>
    <h1>Simple Button Test</h1>
    <p>If this test works, the button will show results below when clicked.</p>
    
    <button id="testBtn">CLICK ME TO TEST</button>
    
    <div id="result"></div>

    <script>
        // Test 1: Alert on page load
        alert('✅ JavaScript is working! Page loaded successfully.');
        
        // Test 2: Button click handler
        document.getElementById('testBtn').addEventListener('click', function() {
            alert('✅ Button clicked successfully!');
            
            const resultDiv = document.getElementById('result');
            resultDiv.style.display = 'block';
            resultDiv.innerHTML = '<h2>SUCCESS!</h2><p>The button works perfectly! JavaScript is running correctly.</p>';
        });
        
        console.log('Script loaded and ready');
    </script>
</body>
</html>
